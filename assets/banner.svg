<svg xmlns="http://www.w3.org/2000/svg" width="846" height="246" viewBox="0 0 846 246" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Thiago Augusto — Desenvolvedor Web</title>
  <desc id="banner-desc">Graduando em Engenharia de Software. Websites, aplicações e soluções digitais para negócios. Front-end: HTML, CSS e JavaScript. Back-end: Python e Django. Foco em Full Stack.</desc>
  <defs><linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#67DC57"/><stop offset="100%" stop-color="#2185E9"/></linearGradient></defs>
  <rect width="846" height="246" rx="13" fill="#101820"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="46" font-size="14" font-weight="700" letter-spacing="2" fill="#35C9A5">DESENVOLVIMENTO WEB</text>
    <text x="26" y="104" font-size="48" font-weight="700" fill="url(#brand)">Thiago Augusto</text>
    <text x="28" y="136" font-size="19" font-weight="600" fill="#E6EDF3">Graduando em Engenharia de Software</text>
    <text x="28" y="171" font-size="17" fill="#A8B5C0">Websites, aplicações e soluções digitais</text>
    <text x="28" y="193" font-size="17" fill="#A8B5C0">para negócios.</text>
    <rect x="28" y="216" width="70" height="4" rx="2" fill="url(#brand)"/>
  </g>
  <rect x="492" y="36" width="326" height="174" rx="12" fill="#0D1117" stroke="#263442"/>
  <g><circle cx="510" cy="54" r="4" fill="#FF5F56"/><circle cx="524" cy="54" r="4" fill="#FFBD2E"/><circle cx="538" cy="54" r="4" fill="#27C93F"/></g>
  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="14" fill="#E6EDF3">
    <text x="510" y="86"><tspan fill="#79B8FF">const</tspan> developer = {</text>
    <text x="523" y="110">frontend: <tspan fill="#8DDB8C">'HTML, CSS, JS'</tspan>,</text>
    <text x="523" y="134">backend: <tspan fill="#8DDB8C">'Python, Django'</tspan>,</text>
    <text x="523" y="158">focus: <tspan fill="#8DDB8C">'Full Stack'</tspan></text>
    <text x="510" y="182">};</text>
  </g>
</svg>
