name: Construir cards do README
on:
  push:
    paths:
      - ".github/workflows/build-readme-cards.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install Pillow
      - name: Montar cards e atualizar README
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          P = [
              ("marinelli", "Eletrotécnica Marinelli", ["Website institucional com automação", "de formulários e candidaturas."], ["HTML","CSS","JavaScript"]),
              ("django-cafeteria","Django Cafeteria",["Aplicação web de catálogo de produtos", "utilizando Python e Django."],["Python","Django"]),
              ("ferrobran","Construir com Aço",["Landing page comercial do programa", "de parcerias da Ferrobran."],["HTML","CSS","JavaScript"]),
              ("canela","Canela Engenharia Elétrica",["Website institucional para serviços", "elétricos e captação de clientes."],["HTML","CSS","JavaScript"]),
          ]
          BG=(16,24,32); W=(240,246,252); M=(190,199,207); TEAL=(53,201,165)
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          BOLD='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def ft(size, bold=False): return ImageFont.truetype(BOLD if bold else FONT,size)
          out=Path('projects/cards')
          out.mkdir(parents=True,exist_ok=True)
          for key,title,desc,stack in P:
              card=Image.new('RGB',(720,560),BG)
              draw=ImageDraw.Draw(card)
              draw.rounded_rectangle((0,0,719,559),radius=24,fill=BG)
              im=Image.open(f'projects/{key}.png').convert('RGB')
              thumb=ImageOps.fit(im,(680,300),method=Image.Resampling.LANCZOS,centering=(0.5,0.4))
              mask=Image.new('L',(680,300),0)
              ImageDraw.Draw(mask).rounded_rectangle((0,0,679,299),radius=17,fill=255)
              card.paste(thumb,(20,20),mask)
              draw=ImageDraw.Draw(card)
              draw.text((30,338),title,font=ft(30,True),fill=W)
              for i,line in enumerate(desc): draw.text((30,388+29*i),line,font=ft(21),fill=M)
              x=30
              for label in stack:
                  f=ft(17,True)
                  width=int(draw.textlength(label,font=f))+42
                  draw.rounded_rectangle((x,474,x+width,517),radius=20,fill=(18,38,46),outline=TEAL,width=2)
                  draw.text((x+21,487),label,font=f,fill=W)
                  x+=width+11
              card.save(out/(key+'.png'),optimize=True)
          
          readme=Path('README.md')
          s=readme.read_text(encoding='utf-8')
          a=s.index('<!-- PROJETOS EM DESTAQUE -->')
          b=s.index('<!-- Formação -->',a)
          novo='''<!-- PROJETOS EM DESTAQUE -->
          
          ## Projetos em destaque
          
          <p align="center">
            <a href="https://thiagoaugustx.github.io/website-eletrotecnica-marinelli/"><img src="./projects/cards/marinelli.png" width="355" alt="Projeto Eletrotécnica Marinelli: website institucional com formulários automatizados"/></a>&nbsp;
            <a href="https://github.com/thiagoaugustx/Django-Cafeteria"><img src="./projects/cards/django-cafeteria.png" width="355" alt="Projeto Django Cafeteria: catálogo de produtos em Django"/></a>
          </p>
          <p align="center">
            <a href="https://github.com/thiagoaugustx/website-eletrotecnica-marinelli"><img src="./projects/repositorio.svg" width="115" alt="Código da Marinelli"/></a>
            <a href="https://thiagoaugustx.github.io/website-eletrotecnica-marinelli/"><img src="./projects/visitar-site.svg" width="115" alt="Visitar site da Marinelli"/></a>
            &emsp;&emsp;&emsp;&emsp;
            <a href="https://github.com/thiagoaugustx/Django-Cafeteria"><img src="./projects/repositorio.svg" width="115" alt="Código da Django Cafeteria"/></a>
          </p>
          <p align="center">
            <a href="https://github.com/thiagoaugustx/construir-com-aco"><img src="./projects/cards/ferrobran.png" width="355" alt="Projeto Construir com Aço: landing page da Ferrobran"/></a>&nbsp;
            <a href="https://github.com/thiagoaugustx/Canela-Engenharia-Eletrica"><img src="./projects/cards/canela.png" width="355" alt="Projeto Canela Engenharia Elétrica: website institucional"/></a>
          </p>
          <p align="center">
            <a href="https://github.com/thiagoaugustx/construir-com-aco"><img src="./projects/repositorio.svg" width="115" alt="Código da Ferrobran"/></a>
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;
            <a href="https://github.com/thiagoaugustx/Canela-Engenharia-Eletrica"><img src="./projects/repositorio.svg" width="115" alt="Código da Canela Engenharia Elétrica"/></a>
          </p>
          
          '''
          readme.write_text(s[:a]+novo+s[b:],encoding='utf-8')
          
          PY
      - name: Publicar cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md projects/cards/
          git commit -m "Padroniza Projetos em destaque com cards sem bordas"
          git push
